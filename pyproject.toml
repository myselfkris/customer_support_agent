[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Agentic AI customer support application (Gemini + LangGraph + pgvector)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "langgraph",
    "psycopg2-binary",
    "pgvector",
    "sqlalchemy",
    "alembic",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "rag*", "app*", "db*"]
